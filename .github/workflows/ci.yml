name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, e.g. v1.0.0'
        type: string
        required: true
        default: 'v1.0.0'

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Typecheck (renderer and Node)
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  package:
    name: Installer (${{ matrix.label }})
    # Installers are built for tags and for a manual run; a full three-OS
    # matrix on every push would spend twenty minutes producing artefacts
    # nobody downloads.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            command: npm run dist:win
          - os: macos-latest
            label: macOS
            command: npm run dist:mac
          - os: ubuntu-latest
            label: Linux
            command: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build installer
        run: ${{ matrix.command }}

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: videoteca-${{ matrix.label }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.deb
          if-no-files-found: warn

      # Attach the installers to a public release so they can be downloaded
      # without a GitHub account. On a manual run the release (and its tag) is
      # created here from the checked-out commit.
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_VERSION}"
          fi

          # The first matrix job to finish creates the release; the others
          # attach their own installer to it.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Videoteca $tag" \
              --notes "Instaladores de Videoteca $tag para Windows, macOS y Linux." || true
          fi

          # Wait for whichever job is creating the release to finish doing so.
          for _ in $(seq 1 30); do
            gh release view "$tag" >/dev/null 2>&1 && break
            sleep 5
          done

          find release -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -print -exec gh release upload "$tag" {} --clobber \;
