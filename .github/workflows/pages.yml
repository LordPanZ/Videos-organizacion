name: Web app

# Builds the installable web version and publishes it to the gh-pages branch,
# which is what GitHub Pages serves for this repository.
on:
  push:
    branches: ['claude/video-organization-app-rgcsts', 'main']
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.web.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# One deployment at a time; a queued run supersedes rather than cancels, so the
# last push always wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:web
        env:
          # A project site is served from /<repo>/, so every asset URL needs
          # that prefix.
          VIDEOTECA_BASE: /${{ github.event.repository.name }}/

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          # `.nojekyll` stops Pages from filtering files whose names start with
          # an underscore, which a bundler is free to produce.
          touch dist/web/.nojekyll

          cd dist/web
          git init -q -b gh-pages
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          # The branch holds only the built site, so each deploy replaces it
          # wholesale rather than accumulating history nobody reads.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
