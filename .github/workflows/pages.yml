name: Web app

# Publishes the installable web version to GitHub Pages. The desktop
# installers are built separately by the CI workflow.
on:
  push:
    branches: ['claude/video-organization-app-rgcsts', 'main']
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.web.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs supersede rather than cancel, so the
# last push always wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build:web
        env:
          # A project site is served from /<repo>/, so every asset URL needs
          # that prefix.
          VIDEOTECA_BASE: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
