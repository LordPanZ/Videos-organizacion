    <style>
      /* Shown until the library is open, so a slow first load is never blank. */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0d0f14;
        color: #e7eaf0;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 999;
        padding: 24px;
        text-align: center;
      }
      @media (prefers-color-scheme: light) {
        #splash { background: #f5f6f8; color: #171a20; }
      }
      .splash-mark {
        width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 18px;
        background: linear-gradient(135deg, #4c8dff, #b04cff);
        display: grid; place-items: center; font-size: 30px;
      }
      .splash-error h1 { font-size: 17px; margin: 0 0 10px; }
      .splash-error p { margin: 0 0 8px; opacity: .8; max-width: 420px; }
      .splash-hint { font-size: 13px; opacity: .6 !important; }
    </style>
